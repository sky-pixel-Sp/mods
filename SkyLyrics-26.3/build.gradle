plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "skylyrics" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Pure-Java Java Sound codecs for local offline audio playback (LGPL-2.1).
    implementation "com.googlecode.soundlibs:mp3spi:1.9.5.4"
    implementation "com.googlecode.soundlibs:vorbisspi:1.0.3.3"
    include "com.googlecode.soundlibs:mp3spi:1.9.5.4"
    include "com.googlecode.soundlibs:vorbisspi:1.0.3.3"
    // Loom's include configuration is not transitive: bundle codec runtimes explicitly.
    include "com.googlecode.soundlibs:jlayer:1.0.1.4"
    include "com.googlecode.soundlibs:jorbis:0.0.17.4"
    include "com.googlecode.soundlibs:tritonus-share:0.3.7.4"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def googleFontsCommit = '86aced91de05cd4f96a06838124cca45be337b2b'
def generatedSkyArtwork = layout.buildDirectory.dir('generated/skylyrics-artwork-resources')
def generatedSkyOriginals = layout.buildDirectory.dir('generated/skylyrics-original-source-files')
def skyArtworkSources = [
    [id: 'jack_o_lantern', file: 'jpegPIA23403.jpg', title: "The Jack-o'-Lantern Nebula", credit: 'NASA/JPL-Caltech', page: 'https://www.jpl.nasa.gov/images/pia23403-the-jack-o-lantern-nebula/'],
    [id: 'catspaw', file: 'jpegPIA22567.jpg', title: "Cat's Paw Nebula", credit: 'NASA/JPL-Caltech', page: 'https://www.jpl.nasa.gov/images/pia22567-cats-paw-image-2/'],
    [id: 'eagle', file: 'jpegPIA25433.jpg', title: 'The Eagle Nebula Observed by WISE', credit: 'NASA/JPL-Caltech', page: 'https://www.jpl.nasa.gov/images/pia25433-the-eagle-nebula-observed-by-wise/'],
    [id: 'north_america', file: 'jpegPIA13845.jpg', title: 'North America Nebula in Different Lights', credit: 'NASA/JPL-Caltech', page: 'https://www.jpl.nasa.gov/images/pia13845-north-america-nebula-in-different-lights/'],
    [id: 'blue_ring', file: 'jpegPIA23867.jpg', title: 'The Blue Ring Nebula', credit: 'NASA/JPL-Caltech, M. Seibert (Carnegie Institution for Science), K. Hoadley (Caltech), GALEX Team', page: 'https://www.jpl.nasa.gov/images/pia23867-the-blue-ring-nebula/'],
    [id: 'lynds_bright', file: 'jpegPIA13127.jpg', title: 'A Nebula by Any Other Name (LBN 114.55+00.22)', credit: 'NASA/JPL-Caltech/UCLA', page: 'https://www.jpl.nasa.gov/images/pia13127-a-nebula-by-any-other-name/'],
    [id: 'audience_favorite', file: 'jpegPIA15413.jpg', title: 'An Audience Favorite Nebula', credit: 'NASA/JPL-Caltech/University of Wisconsin', page: 'https://www.jpl.nasa.gov/images/pia15413-an-audience-favorite-nebula/'],
    [id: 'w51', file: 'jpegPIA23865.jpg', title: 'Spitzer Image of Star Factory W51', credit: 'NASA/JPL-Caltech', page: 'https://www.jpl.nasa.gov/images/pia23865-spitzer-image-of-star-factory-w51/']
]

sourceSets.main.resources.srcDir(generatedSkyArtwork)

tasks.register('downloadSkyArtwork') {
    group = 'build setup'
    description = 'Downloads real NASA/JPL nebula photographs and creates in-game 16:9 preview textures.'
    outputs.dir(generatedSkyArtwork)
    outputs.dir(generatedSkyOriginals)
    doLast {
        File root = generatedSkyArtwork.get().asFile
        File originals = generatedSkyOriginals.get().asFile
        File previews = new File(root, 'assets/skylyrics/textures/gui/sky_gallery')
        File notice = new File(root, 'META-INF/licenses/skylyrics-artwork/NOTICE.txt')
        originals.mkdirs()
        previews.mkdirs()
        notice.parentFile.mkdirs()

        skyArtworkSources.each { spec ->
            File original = new File(originals, "${spec.id}.jpg")
            URL url = new URL("https://d2pn8kiwq2w21t.cloudfront.net/original_images/${spec.file}")
            URLConnection connection = url.openConnection()
            connection.connectTimeout = 20000
            connection.readTimeout = 60000
            connection.setRequestProperty('User-Agent', 'SkyLyrics-build/0.9.2')
            connection.inputStream.withCloseable { input ->
                original.withOutputStream { output -> input.transferTo(output) }
            }
            if (!original.isFile() || original.length() < 20000L) {
                throw new GradleException("NASA/JPL artwork is missing or incomplete: ${spec.file}")
            }

            java.awt.image.BufferedImage source = javax.imageio.ImageIO.read(original)
            if (source == null || source.width < 600 || source.height < 400) {
                throw new GradleException("NASA/JPL artwork is not a valid high-resolution image: ${spec.file}")
            }

            int targetWidth = 1600
            int targetHeight = 900
            double sourceAspect = source.width / (double) source.height
            double targetAspect = targetWidth / (double) targetHeight
            int cropWidth = source.width
            int cropHeight = source.height
            if (sourceAspect > targetAspect) {
                cropWidth = Math.max(1, (int) Math.round(source.height * targetAspect))
            } else {
                cropHeight = Math.max(1, (int) Math.round(source.width / targetAspect))
            }
            int cropX = (source.width - cropWidth) / 2
            int cropY = (source.height - cropHeight) / 2
            java.awt.image.BufferedImage preview = new java.awt.image.BufferedImage(
                targetWidth, targetHeight, java.awt.image.BufferedImage.TYPE_INT_RGB
            )
            java.awt.Graphics2D graphics = preview.createGraphics()
            try {
                graphics.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION,
                    java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC)
                graphics.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING,
                    java.awt.RenderingHints.VALUE_RENDER_QUALITY)
                graphics.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING,
                    java.awt.RenderingHints.VALUE_ANTIALIAS_ON)
                graphics.drawImage(source, 0, 0, targetWidth, targetHeight,
                    cropX, cropY, cropX + cropWidth, cropY + cropHeight, null)
            } finally {
                graphics.dispose()
            }

            File previewFile = new File(previews, "${spec.id}.jpg")
            javax.imageio.ImageWriter writer = javax.imageio.ImageIO.getImageWritersByFormatName('jpg').next()
            javax.imageio.stream.ImageOutputStream imageOutput = javax.imageio.ImageIO.createImageOutputStream(previewFile)
            try {
                writer.setOutput(imageOutput)
                javax.imageio.ImageWriteParam parameters = writer.getDefaultWriteParam()
                parameters.setCompressionMode(javax.imageio.ImageWriteParam.MODE_EXPLICIT)
                parameters.setCompressionQuality(0.96f)
                writer.write(null, new javax.imageio.IIOImage(preview, null, null), parameters)
                imageOutput.flush()
            } finally {
                writer.dispose()
                imageOutput.close()
                source.flush()
                preview.flush()
            }
            if (!previewFile.isFile() || previewFile.length() < 15000L) {
                throw new GradleException("Generated preview is missing or incomplete: ${previewFile}")
            }
        }

        notice.text = """SkyLyrics by Sky — NASA/JPL gallery artwork

The following original astronomy photographs are bundled as optional UI preview artwork.
The full-resolution source JPG is kept under assets/skylyrics/gallery/original/.
A 1600x900 center-cropped JPEG preview is used by the in-game Skies selector.

${skyArtworkSources.collect { spec -> "- ${spec.title} | ${spec.credit}\n  Source: ${spec.page}" }.join('\n')}

JPL Image Use Policy:
https://www.jpl.nasa.gov/jpl-image-use-policy/

Credit lines are retained here for each image. SkyLyrics is an independent mod and is not endorsed by NASA, JPL, or Caltech.
"""
        long originalsBytes = skyArtworkSources.sum { new File(originals, "${it.id}.jpg").length() } as long
        long previewBytes = skyArtworkSources.sum { new File(previews, "${it.id}.jpg").length() } as long
        println "Downloaded ${skyArtworkSources.size()} NASA/JPL photographs: ${originalsBytes} original bytes + ${previewBytes} preview bytes."
    }
}

def generatedSkyFonts = layout.buildDirectory.dir('generated/skylyrics-font-resources')
def skyFontSources = [
    [id: 'poppins', file: 'poppins/Poppins-Regular.ttf'],
    [id: 'montserrat', file: 'montserrat/Montserrat%5Bwght%5D.ttf'],
    [id: 'kanit', file: 'kanit/Kanit-Regular.ttf'],
    [id: 'fredoka', file: 'fredoka/Fredoka%5Bwdth%2Cwght%5D.ttf'],
    [id: 'unbounded', file: 'unbounded/Unbounded%5Bwght%5D.ttf'],
    [id: 'bebasneue', file: 'bebasneue/BebasNeue-Regular.ttf'],
    [id: 'pacifico', file: 'pacifico/Pacifico-Regular.ttf'],
    [id: 'caveat', file: 'caveat/Caveat%5Bwght%5D.ttf']
]

sourceSets.main.resources.srcDir(generatedSkyFonts)

 tasks.register('downloadSkyFonts') {
    group = 'build setup'
    description = 'Downloads pinned Open Font License typefaces and their license notices.'
    outputs.dir(generatedSkyFonts)
    doLast {
        File root = generatedSkyFonts.get().asFile
        skyFontSources.each { spec ->
            File fontTarget = new File(root, "assets/skylyrics/font/${spec.id}.ttf")
            File licenseTarget = new File(root, "META-INF/licenses/skylyrics-fonts/${spec.id}-OFL.txt")
            fontTarget.parentFile.mkdirs()
            licenseTarget.parentFile.mkdirs()

            def downloadPinned = { String relativePath, File target ->
                URL url = new URL("https://raw.githubusercontent.com/google/fonts/${googleFontsCommit}/ofl/${relativePath}")
                URLConnection connection = url.openConnection()
                connection.connectTimeout = 15000
                connection.readTimeout = 45000
                connection.setRequestProperty('User-Agent', 'SkyLyrics-build/0.4.0')
                connection.inputStream.withCloseable { input ->
                    target.withOutputStream { output -> input.transferTo(output) }
                }
                if (!target.isFile() || target.length() < 1024) {
                    throw new GradleException("Font asset is missing or incomplete: ${relativePath}")
                }
            }

            downloadPinned(spec.file, fontTarget)
            downloadPinned("${spec.id}/OFL.txt", licenseTarget)
        }
        println "Downloaded ${skyFontSources.size()} pinned Open Font License families."
    }
}

processResources {
    dependsOn tasks.named('downloadSkyFonts'), tasks.named('downloadSkyArtwork')
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.register('verifySkyResources') {
    group = 'verification'
    dependsOn tasks.named('downloadSkyFonts'), tasks.named('downloadSkyArtwork')
    doLast {
        def effectDir = file('src/main/resources/assets/skylyrics/post_effect')
        def effects = effectDir.exists() ? effectDir.listFiles().findAll { it.name.endsWith('.json') } : []
        if (effects.size() != 20) throw new GradleException("Expected 20 sky presets, found ${effects.size()}.")
        def parser = new groovy.json.JsonSlurper()
        effects.each {
            def data = parser.parse(it)
            if (!(data.passes instanceof List) || data.passes.size() != 2)
                throw new GradleException("Invalid sky post-effect JSON: ${it.name}")
        }

        def shaderDir = file('src/main/resources/assets/skylyrics/shaders/post')
        ['sky.vsh', 'sky.fsh', 'copy.vsh', 'copy.fsh'].each {
            if (!new File(shaderDir, it).isFile()) throw new GradleException("Missing shader ${it}")
        }

        def fontJsonDir = file('src/main/resources/assets/skylyrics/font')
        def fontJsons = fontJsonDir.exists() ? fontJsonDir.listFiles().findAll { it.name.endsWith('.json') } : []
        if (fontJsons.size() != 8) throw new GradleException("Expected 8 font definitions, found ${fontJsons.size()}.")
        fontJsons.each {
            def data = parser.parse(it)
            if (!(data.providers instanceof List) || data.providers.size() < 2)
                throw new GradleException("Invalid font definition: ${it.name}")
        }

        File generatedRoot = generatedSkyFonts.get().asFile
        skyFontSources.each { spec ->
            if (!new File(generatedRoot, "assets/skylyrics/font/${spec.id}.ttf").isFile())
                throw new GradleException("Missing TTF font: ${spec.id}")
            if (!new File(generatedRoot, "META-INF/licenses/skylyrics-fonts/${spec.id}-OFL.txt").isFile())
                throw new GradleException("Missing OFL license: ${spec.id}")
        }
        File artworkRoot = generatedSkyArtwork.get().asFile
        File artworkOriginals = generatedSkyOriginals.get().asFile
        File artworkPreviews = new File(artworkRoot, 'assets/skylyrics/textures/gui/sky_gallery')
        if (skyArtworkSources.size() != 8) throw new GradleException("Expected 8 credited gallery photographs.")
        skyArtworkSources.each { spec ->
            File original = new File(artworkOriginals, "${spec.id}.jpg")
            File preview = new File(artworkPreviews, "${spec.id}.jpg")
            if (!original.isFile() || original.length() < 20000L) throw new GradleException("Missing original gallery photo: ${spec.id}")
            if (!preview.isFile() || preview.length() < 15000L) throw new GradleException("Missing gallery preview texture: ${spec.id}")
            def decoded = javax.imageio.ImageIO.read(preview)
            if (decoded == null || decoded.width != 1600 || decoded.height != 900) throw new GradleException("Invalid 1600x900 preview: ${spec.id}")
            decoded.flush()
        }
        if (!new File(artworkRoot, 'META-INF/licenses/skylyrics-artwork/NOTICE.txt').isFile()) {
            throw new GradleException("Missing NASA/JPL artwork credits and usage notice.")
        }
        println "Verified 20 sky effects, four shaders, eight TTF families, eight OFL notices, and 8 NASA/JPL photo originals + previews."
    }
}

tasks.test {
    useJUnitPlatform()
    dependsOn 'verifySkyResources', 'downloadSkyArtwork'
}

tasks.register('verifySkyJar') {
    group = 'verification'
    description = 'Checks that every required SkyLyrics resource and nested audio codec is present in the final distributable JAR.'
    dependsOn tasks.named('jar')
    doLast {
        File archiveFile = tasks.named('jar').get().archiveFile.get().asFile
        if (!archiveFile.isFile() || archiveFile.length() == 0L) {
            throw new GradleException("Final SkyLyrics JAR is missing or empty: ${archiveFile}")
        }

        def zip = new java.util.zip.ZipFile(archiveFile)
        try {
            def entries = []
            def enumeration = zip.entries()
            while (enumeration.hasMoreElements()) entries.add(enumeration.nextElement())
            def names = entries.collect { it.name } as Set

            def required = [
                'fabric.mod.json',
                'assets/skylyrics/icon.png',
                'assets/skylyrics/shaders/post/sky.vsh',
                'assets/skylyrics/shaders/post/sky.fsh',
                'assets/skylyrics/shaders/post/copy.vsh',
                'assets/skylyrics/shaders/post/copy.fsh',
                'META-INF/licenses/skylyrics-audio/NOTICE.txt',
                'META-INF/licenses/skylyrics-artwork/NOTICE.txt'
            ]
            required.each { name ->
                if (!names.contains(name)) throw new GradleException("Final JAR is missing required resource: ${name}")
            }

            def fontFiles = entries.findAll {
                it.name.startsWith('assets/skylyrics/font/') && it.name.endsWith('.ttf')
            }
            if (fontFiles.size() != 8) throw new GradleException("Expected 8 embedded TTF fonts, found ${fontFiles.size()}.")
            fontFiles.each {
                if (it.size < 1024L) throw new GradleException("Embedded font is empty or incomplete: ${it.name}")
                String family = it.name.substring(it.name.lastIndexOf('/') + 1, it.name.length() - 4)
                String license = "META-INF/licenses/skylyrics-fonts/${family}-OFL.txt"
                if (!names.contains(license)) throw new GradleException("Missing font license in final JAR: ${license}")
            }

            def effects = entries.findAll {
                it.name.startsWith('assets/skylyrics/post_effect/') && it.name.endsWith('.json')
            }
            if (effects.size() != 20) throw new GradleException("Expected 20 packaged sky presets, found ${effects.size()}.")

            def galleryPreviews = entries.findAll {
                it.name.startsWith('assets/skylyrics/textures/gui/sky_gallery/') && it.name.endsWith('.jpg')
            }
            if (galleryPreviews.size() != 8) throw new GradleException("Expected 8 genuine in-game NASA/JPL preview textures, found ${galleryPreviews.size()}.")
            long galleryBytes = 0L
            galleryPreviews.each { entry ->
                if (entry.size < 15000L) throw new GradleException("Artwork preview is too small or incomplete: ${entry.name}")
                def decoded = javax.imageio.ImageIO.read(zip.getInputStream(entry))
                if (decoded == null || decoded.width != 1600 || decoded.height != 900) {
                    throw new GradleException("Invalid packaged artwork preview: ${entry.name}")
                }
                decoded.flush()
                galleryBytes += entry.size
            }


            def codecNames = [
                'META-INF/jars/mp3spi-1.9.5.4.jar',
                'META-INF/jars/vorbisspi-1.0.3.3.jar',
                'META-INF/jars/jlayer-1.0.1.4.jar',
                'META-INF/jars/jorbis-0.0.17.4.jar',
                'META-INF/jars/tritonus-share-0.3.7.4.jar'
            ]
            codecNames.each { name ->
                if (!names.contains(name)) throw new GradleException("Missing bundled audio codec: ${name}")
            }

            def parser = new groovy.json.JsonSlurper()
            def metadata = parser.parse(zip.getInputStream(zip.getEntry('fabric.mod.json')))
            if (!(metadata.authors instanceof List) || metadata.authors != ['Sky']) {
                throw new GradleException("fabric.mod.json author must be exactly Sky.")
            }
            if (metadata.icon != 'assets/skylyrics/icon.png') {
                throw new GradleException("fabric.mod.json does not point to the packaged SkyLyrics icon.")
            }
            if (metadata.depends.minecraft != '~26.3' || metadata.depends.java != '>=25') {
                throw new GradleException("Final JAR metadata is not targeting Minecraft 26.3 / Java 25.")
            }

            long uncompressedBytes = 0L
            entries.each { uncompressedBytes += Math.max(0L, it.size) }
            if (uncompressedBytes < 3_000_000L) {
                throw new GradleException("Final JAR payload is unexpectedly small (${uncompressedBytes} uncompressed bytes); bundled resources may be missing.")
            }
            println "Verified final JAR: Sky author, icon, 8 TTF fonts, 20 sky presets, 4 shaders, 5 audio codecs, and 8 genuine NASA/JPL 1600x900 preview textures (${galleryBytes} artwork bytes); ${uncompressedBytes} uncompressed bytes; ${archiveFile.length()} compressed JAR bytes."
        } finally {
            zip.close()
        }
    }
}

tasks.named('build') {
    dependsOn tasks.named('verifySkyJar')
}

// The generated TTF files are also included in the sources archive.
tasks.named('sourcesJar') {
    dependsOn tasks.named('downloadSkyFonts'), tasks.named('downloadSkyArtwork')
}

jar {
    from('LICENSE') { rename { "${it}_${project.archives_base_name}" } }
}

publishing {
    publications { create('mavenJava', MavenPublication) { from components.java } }
}
