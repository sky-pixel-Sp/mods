plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "skylyrics" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Pure-Java Java Sound codecs for local offline audio playback (LGPL-2.1).
    implementation "com.googlecode.soundlibs:mp3spi:1.9.5.4"
    implementation "com.googlecode.soundlibs:vorbisspi:1.0.3.3"
    include "com.googlecode.soundlibs:mp3spi:1.9.5.4"
    include "com.googlecode.soundlibs:vorbisspi:1.0.3.3"
    // Loom's include configuration is not transitive: bundle codec runtimes explicitly.
    include "com.googlecode.soundlibs:jlayer:1.0.1.4"
    include "com.googlecode.soundlibs:jorbis:0.0.17.4"
    include "com.googlecode.soundlibs:tritonus-share:0.3.7.4"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def googleFontsCommit = '86aced91de05cd4f96a06838124cca45be337b2b'
def generatedSkyFonts = layout.buildDirectory.dir('generated/skylyrics-font-resources')
def skyFontSources = [
    [id: 'poppins', file: 'poppins/Poppins-Regular.ttf'],
    [id: 'montserrat', file: 'montserrat/Montserrat%5Bwght%5D.ttf'],
    [id: 'kanit', file: 'kanit/Kanit-Regular.ttf'],
    [id: 'fredoka', file: 'fredoka/Fredoka%5Bwdth%2Cwght%5D.ttf'],
    [id: 'unbounded', file: 'unbounded/Unbounded%5Bwght%5D.ttf'],
    [id: 'bebasneue', file: 'bebasneue/BebasNeue-Regular.ttf'],
    [id: 'pacifico', file: 'pacifico/Pacifico-Regular.ttf'],
    [id: 'caveat', file: 'caveat/Caveat%5Bwght%5D.ttf']
]

sourceSets.main.resources.srcDir(generatedSkyFonts)

tasks.register('downloadSkyFonts') {
    group = 'build setup'
    description = 'Downloads pinned Open Font License typefaces and their license notices.'
    outputs.dir(generatedSkyFonts)
    doLast {
        File root = generatedSkyFonts.get().asFile
        skyFontSources.each { spec ->
            File fontTarget = new File(root, "assets/skylyrics/font/${spec.id}.ttf")
            File licenseTarget = new File(root, "META-INF/licenses/skylyrics-fonts/${spec.id}-OFL.txt")
            fontTarget.parentFile.mkdirs()
            licenseTarget.parentFile.mkdirs()

            def downloadPinned = { String relativePath, File target ->
                URL url = new URL("https://raw.githubusercontent.com/google/fonts/${googleFontsCommit}/ofl/${relativePath}")
                URLConnection connection = url.openConnection()
                connection.connectTimeout = 15000
                connection.readTimeout = 45000
                connection.setRequestProperty('User-Agent', 'SkyLyrics-build/0.4.0')
                connection.inputStream.withCloseable { input ->
                    target.withOutputStream { output -> input.transferTo(output) }
                }
                if (!target.isFile() || target.length() < 1024) {
                    throw new GradleException("Font asset is missing or incomplete: ${relativePath}")
                }
            }

            downloadPinned(spec.file, fontTarget)
            downloadPinned("${spec.id}/OFL.txt", licenseTarget)
        }
        println "Downloaded ${skyFontSources.size()} pinned Open Font License families."
    }
}

processResources {
    dependsOn tasks.named('downloadSkyFonts')
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.register('verifySkyResources') {
    group = 'verification'
    dependsOn tasks.named('downloadSkyFonts')
    doLast {
        def effectDir = file('src/main/resources/assets/skylyrics/post_effect')
        def effects = effectDir.exists() ? effectDir.listFiles().findAll { it.name.endsWith('.json') } : []
        if (effects.size() != 20) throw new GradleException("Expected 20 sky presets, found ${effects.size()}.")
        def parser = new groovy.json.JsonSlurper()
        effects.each {
            def data = parser.parse(it)
            if (!(data.passes instanceof List) || data.passes.size() != 2)
                throw new GradleException("Invalid sky post-effect JSON: ${it.name}")
        }

        def shaderDir = file('src/main/resources/assets/skylyrics/shaders/post')
        ['sky.vsh', 'sky.fsh', 'copy.vsh', 'copy.fsh'].each {
            if (!new File(shaderDir, it).isFile()) throw new GradleException("Missing shader ${it}")
        }

        def fontJsonDir = file('src/main/resources/assets/skylyrics/font')
        def fontJsons = fontJsonDir.exists() ? fontJsonDir.listFiles().findAll { it.name.endsWith('.json') } : []
        if (fontJsons.size() != 8) throw new GradleException("Expected 8 font definitions, found ${fontJsons.size()}.")
        fontJsons.each {
            def data = parser.parse(it)
            if (!(data.providers instanceof List) || data.providers.size() < 2)
                throw new GradleException("Invalid font definition: ${it.name}")
        }

        File generatedRoot = generatedSkyFonts.get().asFile
        skyFontSources.each { spec ->
            if (!new File(generatedRoot, "assets/skylyrics/font/${spec.id}.ttf").isFile())
                throw new GradleException("Missing TTF font: ${spec.id}")
            if (!new File(generatedRoot, "META-INF/licenses/skylyrics-fonts/${spec.id}-OFL.txt").isFile())
                throw new GradleException("Missing OFL license: ${spec.id}")
        }
        println "Verified 20 sky effects, four shaders, eight TTF families, and eight OFL notices."
    }
}

tasks.test {
    useJUnitPlatform()
    dependsOn 'verifySkyResources'
}

tasks.register('verifySkyJar') {
    group = 'verification'
    description = 'Checks that every required SkyLyrics resource and nested audio codec is present in the final distributable JAR.'
    dependsOn tasks.named('jar')
    doLast {
        File archiveFile = tasks.named('jar').get().archiveFile.get().asFile
        if (!archiveFile.isFile() || archiveFile.length() == 0L) {
            throw new GradleException("Final SkyLyrics JAR is missing or empty: ${archiveFile}")
        }

        def zip = new java.util.zip.ZipFile(archiveFile)
        try {
            def entries = []
            def enumeration = zip.entries()
            while (enumeration.hasMoreElements()) entries.add(enumeration.nextElement())
            def names = entries.collect { it.name } as Set

            def required = [
                'fabric.mod.json',
                'assets/skylyrics/icon.png',
                'assets/skylyrics/shaders/post/sky.vsh',
                'assets/skylyrics/shaders/post/sky.fsh',
                'assets/skylyrics/shaders/post/copy.vsh',
                'assets/skylyrics/shaders/post/copy.fsh',
                'META-INF/licenses/skylyrics-audio/NOTICE.txt'
            ]
            required.each { name ->
                if (!names.contains(name)) throw new GradleException("Final JAR is missing required resource: ${name}")
            }

            def fontFiles = entries.findAll {
                it.name.startsWith('assets/skylyrics/font/') && it.name.endsWith('.ttf')
            }
            if (fontFiles.size() != 8) throw new GradleException("Expected 8 embedded TTF fonts, found ${fontFiles.size()}.")
            fontFiles.each {
                if (it.size < 1024L) throw new GradleException("Embedded font is empty or incomplete: ${it.name}")
                String family = it.name.substring(it.name.lastIndexOf('/') + 1, it.name.length() - 4)
                String license = "META-INF/licenses/skylyrics-fonts/${family}-OFL.txt"
                if (!names.contains(license)) throw new GradleException("Missing font license in final JAR: ${license}")
            }

            def effects = entries.findAll {
                it.name.startsWith('assets/skylyrics/post_effect/') && it.name.endsWith('.json')
            }
            if (effects.size() != 20) throw new GradleException("Expected 20 packaged sky presets, found ${effects.size()}.")

            def codecNames = [
                'META-INF/jars/mp3spi-1.9.5.4.jar',
                'META-INF/jars/vorbisspi-1.0.3.3.jar',
                'META-INF/jars/jlayer-1.0.1.4.jar',
                'META-INF/jars/jorbis-0.0.17.4.jar',
                'META-INF/jars/tritonus-share-0.3.7.4.jar'
            ]
            codecNames.each { name ->
                if (!names.contains(name)) throw new GradleException("Missing bundled audio codec: ${name}")
            }

            def parser = new groovy.json.JsonSlurper()
            def metadata = parser.parse(zip.getInputStream(zip.getEntry('fabric.mod.json')))
            if (!(metadata.authors instanceof List) || metadata.authors != ['Sky']) {
                throw new GradleException("fabric.mod.json author must be exactly Sky.")
            }
            if (metadata.icon != 'assets/skylyrics/icon.png') {
                throw new GradleException("fabric.mod.json does not point to the packaged SkyLyrics icon.")
            }
            if (metadata.depends.minecraft != '~26.3' || metadata.depends.java != '>=25') {
                throw new GradleException("Final JAR metadata is not targeting Minecraft 26.3 / Java 25.")
            }

            long uncompressedBytes = 0L
            entries.each { uncompressedBytes += Math.max(0L, it.size) }
            if (uncompressedBytes < 3_000_000L) {
                throw new GradleException("Final JAR payload is unexpectedly small (${uncompressedBytes} uncompressed bytes); bundled resources may be missing.")
            }
            println "Verified final JAR: Sky author, icon, 8 TTF fonts and licenses, 20 sky presets, 4 shaders, and 5 audio codec libraries; ${uncompressedBytes} uncompressed bytes."
        } finally {
            zip.close()
        }
    }
}

tasks.named('build') {
    dependsOn tasks.named('verifySkyJar')
}

// The generated TTF files are also included in the sources archive.
tasks.named('sourcesJar') {
    dependsOn tasks.named('downloadSkyFonts')
}

jar {
    from('LICENSE') { rename { "${it}_${project.archives_base_name}" } }
}

publishing {
    publications { create('mavenJava', MavenPublication) { from components.java } }
}
