name: Build Neon Rift for Windows

on:
  push:
    branches:
      - neon-rift-windows-game
    paths:
      - "Neon-Rift/**"
      - ".github/workflows/neon-rift-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and package Neon Rift x64
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: Neon-Rift
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python -m compileall -q app.py game_engine.py tests

      - name: Run game-engine tests
        run: python -m unittest discover -s tests -v

      - name: Install packaging tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build standalone Windows executable
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name NeonRift app.py

      - name: Verify executable
        run: |
          if (!(Test-Path "dist/NeonRift.exe")) { throw "NeonRift.exe was not created." }
          $exe = Get-Item "dist/NeonRift.exe"
          if ($exe.Length -lt 100000) { throw "NeonRift.exe is unexpectedly small ($($exe.Length) bytes)." }
          Write-Host "Verified $($exe.FullName) ($($exe.Length) bytes)"

      - name: Upload game executable
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Rift-Windows-x64
          path: Neon-Rift/dist/NeonRift.exe
          if-no-files-found: error
          retention-days: 30
