name: Build SkyLyrics for Minecraft 26.3

on:
  pull_request:
    branches:
      - main
    paths:
      - "SkyLyrics-26.3/**"
      - ".github/workflows/build-skylyrics.yml"
      - ".gitattributes"
  push:
    branches:
      - main
      - skylyrics-video-parity
      - skylyrics-0.9.3-audio-session-stability
      - skylyrics-0.10.0-local-in-game
      - skylyrics-0.4-fonts-album-player
      - skylyrics-0.5-cinematic-overhaul
      - skylyrics-0.6-music-center
    paths:
      - "SkyLyrics-26.3/**"
      - ".github/workflows/build-skylyrics.yml"
      - ".gitattributes"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: skylyrics-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, test, and package mod
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.2"
          cache-provider: basic
      - name: Compile, test, and build the Fabric mod
        working-directory: SkyLyrics-26.3
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_25_X64}"
          export PATH="${JAVA_HOME}/bin:${PATH}"
          java -version
          java -version 2>&1 | head -n 1 | grep -Eq 'version "25([.]|\\")'
          gradle --no-daemon -Dorg.gradle.java.home="${JAVA_HOME}" clean test build
          MOD_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | head -n 1)"
          test -n "${MOD_VERSION}"
          JAR="build/libs/skylyrics-${MOD_VERSION}.jar"
          test -s "${JAR}"
          jar tf "${JAR}" | grep -q 'fabric.mod.json'
          jar tf "${JAR}" | grep -q 'assets/skylyrics/icon.png'
          jar tf "${JAR}" | grep -q 'assets/skylyrics/font/unbounded.ttf'
          jar tf "${JAR}" | grep -q 'skylyrics/post_effect/sky_nebula_storm.json'
          jar tf "${JAR}" | grep -q 'skylyrics/post_effect/sky_golden_sunset.json'
          jar tf "${JAR}" | grep -q 'assets/skylyrics/font/poppins.ttf'
          jar tf "${JAR}" | grep -q 'assets/skylyrics/font/montserrat.json'
          jar tf "${JAR}" | grep -q 'InGameFilePickerScreen.class'
          jar tf "${JAR}" | grep -q 'PlaybackSessionGuard.class'
          if jar tf "${JAR}" | grep -Eq 'BrowserMediaServer.class|MediaStatus.class|LyricsLookupClient.class|AlbumArtManager.class'; then
            echo "External browser integration classes must not be packaged in the local-only edition." >&2
            exit 1
          fi
          jar tf "${JAR}" | grep -q 'LocalAudioEngine.class'
          jar tf "${JAR}" | grep -q 'MusicLibrary.class'
          jar tf "${JAR}" | grep -q 'MusicHistory.class'
          jar tf "${JAR}" | grep -q 'SkyLyricsHudWidgets.class'
          jar tf "${JAR}" | grep -q 'HudEditorScreen.class'
          jar tf "${JAR}" | grep -q 'META-INF/licenses/skylyrics-fonts/poppins-OFL.txt'
          jar tf "${JAR}" | grep -q 'META-INF/licenses/skylyrics-audio/NOTICE.txt'
          jar tf "${JAR}" | grep -q 'META-INF/jars/mp3spi-'
          jar tf "${JAR}" | grep -q 'META-INF/jars/vorbisspi-'
          jar tf "${JAR}" | grep -q 'META-INF/jars/jlayer-'
          jar tf "${JAR}" | grep -q 'META-INF/jars/jorbis-'
          jar tf "${JAR}" | grep -q 'META-INF/jars/tritonus-share-'
          echo "SkyLyrics ${MOD_VERSION} JAR, author metadata, icon, embedded fonts, shader presets, offline codecs, Music Center and HUD assets verified."
      - name: Assemble complete install package
        working-directory: SkyLyrics-26.3
        shell: bash
        run: |
          set -euo pipefail
          MOD_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | head -n 1)"
          test -n "${MOD_VERSION}"
          DIST="build/distribution/SkyLyrics-${MOD_VERSION}-Minecraft-26.3"
          rm -rf "${DIST}"
          mkdir -p "${DIST}"
          cp "build/libs/skylyrics-${MOD_VERSION}.jar" "${DIST}/"
          cp README.md LICENSE PANDUAN-ID.md CHANGELOG.md QA_STATUS.md "${DIST}/"
          test -s "${DIST}/skylyrics-${MOD_VERSION}.jar"
          echo "Install package ready: Minecraft-only JAR + README + Indonesian guide + changelog + QA report."

      - name: Upload SkyLyrics install package
        uses: actions/upload-artifact@v7
        with:
          name: SkyLyrics-Minecraft-26.3
          path: SkyLyrics-26.3/build/distribution/
          if-no-files-found: error
          retention-days: 30
