name: Build SkyLyrics for Minecraft 26.3

on:
  push:
    branches:
      - main
    paths:
      - "SkyLyrics-26.3/**"
      - ".github/workflows/build-skylyrics.yml"
      - ".gitattributes"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skylyrics-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, test, and package mod
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.2"
          cache-provider: basic

      - name: Run unit tests and build the Fabric mod
        working-directory: SkyLyrics-26.3
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_25_X64}"
          export PATH="${JAVA_HOME}/bin:${PATH}"
          echo "Selected JAVA_HOME: ${JAVA_HOME}"
          command -v java
          java -version
          java -version 2>&1 | head -n 1 | grep -Eq 'version "25([.]|")'

          gradle --no-daemon -Dorg.gradle.java.home="${JAVA_HOME}" clean test build

          test -s build/libs/skylyrics-0.2.0.jar
          jar tf build/libs/skylyrics-0.2.0.jar | grep -q 'fabric.mod.json'
          echo "SkyLyrics JAR verified."

      - name: Upload SkyLyrics JAR
        uses: actions/upload-artifact@v7
        with:
          name: SkyLyrics-Minecraft-26.3
          path: SkyLyrics-26.3/build/libs/skylyrics-0.2.0.jar
          if-no-files-found: error
          retention-days: 30
