name: Build SkyLyrics for Minecraft 26.3
on:
  push:
    branches:
      - main
      - skylyrics-0.4-fonts-album-player
      - skylyrics-0.5-cinematic-overhaul
    paths:
      - "SkyLyrics-26.3/**"
      - ".github/workflows/build-skylyrics.yml"
      - ".gitattributes"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skylyrics-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Compile, test, and package mod
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.2"
          cache-provider: basic
      - name: Download pinned fonts, compile, test and build
        working-directory: SkyLyrics-26.3
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_25_X64}"
          export PATH="${JAVA_HOME}/bin:${PATH}"
          java -version
          java -version 2>&1 | head -n 1 | grep -Eq 'version "25([.]|")'
          gradle --no-daemon -Dorg.gradle.java.home="${JAVA_HOME}" clean test build
          test -s build/libs/skylyrics-0.5.0.jar
          jar tf build/libs/skylyrics-0.4.0.jar | grep -q 'fabric.mod.json'
          jar tf build/libs/skylyrics-0.4.0.jar | grep -q 'assets/skylyrics/font/poppins.ttf'
          jar tf build/libs/skylyrics-0.4.0.jar | grep -q 'assets/skylyrics/font/montserrat.json'
          jar tf build/libs/skylyrics-0.4.0.jar | grep -q 'AlbumArtManager.class'
          jar tf build/libs/skylyrics-0.4.0.jar | grep -q 'META-INF/licenses/skylyrics-fonts/poppins-OFL.txt'
          echo "SkyLyrics 0.4.0 JAR, custom fonts and album-art module verified."
      - name: Validate browser connector
        working-directory: SkyLyrics-26.3
        shell: bash
        run: |
          set -euo pipefail
          node --check browser-extension/content.js
          node --check browser-extension/background.js
          python -m json.tool browser-extension/manifest.json >/dev/null
          echo "Browser extension scripts and manifest are valid."
      - name: Upload SkyLyrics JAR
        uses: actions/upload-artifact@v7
        with:
          name: SkyLyrics-Minecraft-26.3
          path: SkyLyrics-26.3/build/libs/skylyrics-0.4.0.jar
          if-no-files-found: error
          retention-days: 30
